<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planejamento de Obras — Demonstração</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f4f6;--card:#fff;--tx:#111827;--mut:#6b7280;--bd:#d9dde3;--ac:#1d4ed8;--no:#dc2626;--ok:#15803d;--wa:#b45309;--in:#f9fafb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f13;--card:#171a20;--tx:#f1f3f5;--mut:#9ca3af;--bd:#2c313a;--ac:#60a5fa;--no:#f87171;--ok:#4ade80;--wa:#fbbf24;--in:#0f1216}}
:root[data-theme="dark"]{--bg:#0d0f13;--card:#171a20;--tx:#f1f3f5;--mut:#9ca3af;--bd:#2c313a;--ac:#60a5fa;--no:#f87171;--ok:#4ade80;--wa:#fbbf24;--in:#0f1216}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
.wrap{max-width:1100px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:1.3rem;margin:4px 0 14px}h2{font-size:1.05rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button.dan{background:var(--no);border-color:var(--no);color:#fff;font-weight:600}
button.sm{min-height:36px;padding:6px 10px;font-size:.9rem}
input,select{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--in);color:var(--tx);min-height:42px}
label{display:block;font-size:.78rem;color:var(--mut);margin-bottom:3px;font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:760px){.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}}
@media(max-width:759px){.g6{display:grid;grid-template-columns:1fr 1fr;gap:10px}}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.top h1{margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap}.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.obra{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.obra small{color:var(--mut)}
.sv{border-left:5px solid var(--c);}
.svh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.svh .n{font-weight:700;color:var(--mut);width:24px}
.svh input{flex:1;font-weight:600}
.svh button{min-height:40px;padding:6px 10px}
.st{color:var(--mut);font-size:.85rem;text-align:center;margin:8px 0}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:720px}
th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mut);font-size:.78rem;font-weight:600}
td.r,th.r{text-align:right}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.alert{padding:10px 12px;border-radius:10px;margin:8px 0;font-size:.92rem;line-height:1.4;border:1px solid var(--bd)}
.alert.w{border-color:var(--wa);background:color-mix(in srgb,var(--wa) 10%,transparent)}
.alert.o{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,transparent)}
.alert button{margin-top:8px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi div{background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:10px}
.kpi small{display:block;color:var(--mut);font-size:.78rem}.kpi b{font-size:1.1rem}
.chart{overflow-x:auto;border:1px solid var(--bd);border-radius:10px;background:var(--in)}
.chart svg{display:block}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;margin-top:10px}
.leg span{cursor:pointer;opacity:1}.leg span.off{opacity:.35}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal .box{background:var(--card);border-radius:14px;padding:18px;max-width:400px;width:100%}
.modal p{margin:0 0 14px;line-height:1.4}.modal .bt{display:grid;gap:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-size:.9rem}
.hint{color:var(--mut);font-size:.85rem;margin:0 0 10px;line-height:1.4}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}
.tabs button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.82rem;padding:6px 12px;min-width:74px}
.tabs button i{font-style:normal;font-size:1.15rem}
.sec{font-size:.78rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:16px 0 8px}
textarea{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--in);color:var(--tx);min-height:80px;resize:vertical}
.prog{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);border-radius:6px}
.prog b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tx)}
.ug{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:10px}
.ug button{min-height:46px;padding:4px;font-size:.8rem;line-height:1.15}
.ug button.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.ug button.late{border-color:var(--no);border-width:2px}
.exh{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.exh small{color:var(--mut)}
.tag2{font-size:.75rem;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.tag2.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.tag2.no{background:color-mix(in srgb,var(--no) 18%,transparent);color:var(--no)}
.tag2.n{background:var(--in);color:var(--mut);border:1px solid var(--bd)}
.proj{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.proj:first-of-type{border-top:0}
.proj a{color:var(--ac);font-weight:600;text-decoration:none;word-break:break-word}
.proj .inf{flex:1;min-width:0}.proj small{color:var(--mut);display:block}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<p class="st" id="st">Conectando…</p>
<script>
const $=id=>document.getElementById(id);
function el(t,a,...k){const e=document.createElement(t);if(a)for(const x in a){if(x==="class")e.className=a[x];else if(x==="style")e.style.cssText=a[x];else if(x.startsWith("on"))e[x]=a[x];else e.setAttribute(x,a[x]);}
  k.flat().forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(c));});return e;}
const brl=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const n1=v=>(Math.round(v*10)/10).toLocaleString("pt-BR");
const num=s=>{const v=parseFloat(String(s).replace(/\s|R\$/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",","."));return isNaN(v)?0:v;};
const uid=()=>Math.random().toString(36).slice(2,9);
const CORES=["#2563eb","#dc2626","#16a34a","#d97706","#7c3aed","#0891b2","#db2777","#65a30d","#ea580c","#4f46e5","#0d9488","#9333ea"];
function ask(msg,btns){return new Promise(res=>{const bt=el("div",{class:"bt"});const m=el("div",{class:"modal"},el("div",{class:"box"},el("p",null,msg),bt));
  btns.forEach(([t,v,c])=>bt.append(el("button",{class:c||"",type:"button",onclick:()=>{m.remove();res(v);}},t)));
  m.onclick=e=>{if(e.target===m){m.remove();res(null);}};document.body.append(m);});}
function toast(msg){const t=el("div",{class:"toast"},msg);document.body.append(t);setTimeout(()=>t.remove(),2600);}

// ---------- Modelo: etapas (títulos) e subetapas ----------
// [etapa, subetapa, tipo(g=obra toda,u=por unidade), duração, depende de, espera, pessoas]
const MODELO=[
 ["Pré-obra","Estudo de viabilidade","g",10,"",0,1],
 ["Pré-obra","Projetos (arq., estrutural, elétrico, hidráulico)","g",30,"Estudo de viabilidade",0,2],
 ["Pré-obra","Aprovação legal (alvará e licenças)","g",30,"Projetos (arq., estrutural, elétrico, hidráulico)",0,1],
 ["Pré-obra","Orçamento e cronograma","g",10,"Projetos (arq., estrutural, elétrico, hidráulico)",0,1],
 ["Pré-obra","Preparação do canteiro","g",7,"Aprovação legal (alvará e licenças)",0,4],
 ["Serviços preliminares","Limpeza do terreno","g",3,"Preparação do canteiro",0,4],
 ["Serviços preliminares","Terraplanagem e nivelamento","g",7,"Limpeza do terreno",0,3],
 ["Infraestrutura (fundações)","Locação da obra","g",2,"Terraplanagem e nivelamento",0,3],
 ["Infraestrutura (fundações)","Escavação","g",5,"Locação da obra",0,4],
 ["Infraestrutura (fundações)","Armação e concretagem das fundações","g",8,"Escavação",0,6],
 ["Infraestrutura (fundações)","Vigas baldrame","g",6,"Armação e concretagem das fundações",0,6],
 ["Infraestrutura (fundações)","Impermeabilização do baldrame","g",2,"Vigas baldrame",0,2],
 ["Superestrutura","Armação","g",20,"Impermeabilização do baldrame",0,4],
 ["Superestrutura","Formas","g",20,"Impermeabilização do baldrame",0,4],
 ["Superestrutura","Concretagem","g",8,"Formas",0,8],
 ["Superestrutura","Desforma","g",6,"Concretagem",14,3],
 ["Alvenaria (vedação)","Marcação e elevação","u",4,"Desforma",0,3],
 ["Cobertura","Estrutura do telhado","g",10,"Desforma",0,3],
 ["Cobertura","Telhamento e impermeabilização da laje","g",6,"Estrutura do telhado",0,3],
 ["Instalações prediais","Hidrossanitárias","u",2,"Marcação e elevação",0,2],
 ["Instalações prediais","Elétricas e dados","u",2,"Hidrossanitárias",0,2],
 ["Revestimentos","Chapisco","u",1,"Elétricas e dados",0,2],
 ["Revestimentos","Mestras","u",3,"Chapisco",0,2],
 ["Revestimentos","Emboço/Reboco","u",3,"Mestras",0,3],
 ["Revestimentos","Gesso","u",2,"Emboço/Reboco",0,2],
 ["Revestimentos","Contrapiso","u",2,"Emboço/Reboco",0,2],
 ["Impermeabilização","Áreas molhadas","u",2,"Contrapiso",3,2],
 ["Esquadrias","Portas e janelas","u",1,"Áreas molhadas",0,2],
 ["Acabamentos","Pisos e revestimentos cerâmicos","u",4,"Áreas molhadas",0,2],
 ["Acabamentos","Louças, metais e bancadas","u",1,"Pisos e revestimentos cerâmicos",0,2],
 ["Pintura final","Selador e massa","u",2,"Louças, metais e bancadas",0,2],
 ["Pintura final","Pintura","u",2,"Selador e massa",0,2],
 ["Pós-obra","Limpeza pós-obra","u",1,"Pintura",0,2],
 ["Pós-obra","Vistoria final","u",0.5,"Limpeza pós-obra",0,1],
 ["Pós-obra","Habite-se e registro","g",30,"Vistoria final",0,1]];
function modeloObra(){const ids={},et={},etapas=[];
  const servicos=MODELO.map(([e,nome,t,dur,dep,lag,pes])=>{if(!et[e]){et[e]=uid();etapas.push({id:et[e],nome:e});}
    const s={id:uid(),etapa:et[e],tipo:t==="g"?"global":"unit",nome,dur,equipes:1,pessoas:pes,dep:dep?ids[dep]:"",lag,inicioMin:"",custo:0,periodos:[]};ids[nome]=s.id;return s;});
  return{etapas,servicos};}
const tipoDe=s=>s.tipo||"unit";
function normalizar(o){
  if(!o.etapas){const nomes={pre:"Pré-obra",exec:"Execução",pos:"Pós-obra"};o.etapas=[];const vist={};
    (o.servicos||[]).forEach(s=>{const f=s.fase||"exec";if(!vist[f]){vist[f]=uid();o.etapas.push({id:vist[f],nome:nomes[f]||f});}s.etapa=vist[f];});
    if(!o.etapas.length)o.etapas.push({id:uid(),nome:"Execução"});}
  const ids=new Set(o.etapas.map(e=>e.id));
  (o.servicos=o.servicos||[]).forEach(s=>{if(!ids.has(s.etapa))s.etapa=o.etapas[0].id;if(s.pessoas==null)s.pessoas=0;if(!s.periodos)s.periodos=[];if(!s.tipo)s.tipo="unit";});
  o.exec=o.exec||{};o.projetos=o.projetos||[];return o;}
function ordenar(o){normalizar(o);const ord={};o.etapas.forEach((e,i)=>ord[e.id]=i);
  o.servicos=o.servicos.map((s,i)=>[s,i]).sort((x,y)=>ord[x[0].etapa]-ord[y[0].etapa]||x[1]-y[1]).map(x=>x[0]);}
const nomeEtapa=(o,id)=>(o.etapas.find(e=>e.id===id)||{}).nome||"—";
let fechadas=new Set();

// ---------- Calendário (dias úteis) ----------
function Cal(o){
  const ini=new Date(o.inicio+"T12:00"),fer=new Set(o.feriados||[]),dias=[];
  const util=d=>{const w=d.getDay();if(w===0)return false;if(w===6&&!o.sabado)return false;return !fer.has(iso(d));};
  function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  const cur=new Date(ini);
  function ext(n){while(dias.length<=n){if(util(cur))dias.push(new Date(cur));cur.setDate(cur.getDate()+1);}}
  return{
    data(i){i=Math.max(0,Math.floor(i+1e-9));ext(i);return dias[i];},
    fim(e){return this.data(Math.ceil(e-1e-9)-1);},
    idx(isoStr){if(!isoStr)return 0;const alvo=new Date(isoStr+"T12:00");let i=0;while(true){ext(i);if(dias[i]>=alvo)return i;i++;if(i>20000)return i;}},
    iso
  };
}
const fd=d=>d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit"});

// ---------- Motor de cálculo (linha de balanço) ----------
function addDia(iso){const d=new Date(iso+"T12:00");d.setDate(d.getDate()+1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function calcular(o){
  ordenar(o);
  const cal=Cal(o),N=Math.max(1,Math.floor(o.unidades||1)),res={},ordem=[];
  o.servicos.forEach((s,si)=>{
    const tp=tipoDe(s),gl=tp!=="unit";
    const d=Math.max(0.1,+s.dur||0.1),k=gl?1:Math.max(1,Math.floor(+s.equipes||1)),lag=Math.max(0,+s.lag||0),pes=Math.max(0,+s.pessoas||0);
    const modo=s.modoInicio||(s.inicioMin?"min":"auto");
    const fixo=modo==="fixo"&&s.inicioFixo;
    const S0=fixo?cal.idx(s.inicioFixo):(modo==="min"&&s.inicioMin?cal.idx(s.inicioMin):0);
    const predReal=s.dep&&res[s.dep]?res[s.dep]:null;
    const pred=fixo?null:predReal;
    let aviso=s.dep&&!res[s.dep]?"A dependência está abaixo deste serviço na lista — foi ignorada.":null;
    const predUn=pred&&!pred.gl;
    const un=[];let espera=0,primeiraEspera=null,ideal=S0,folga=null,per=[];
    if(tp==="periodos"){
      per=(s.periodos||[]).filter(p=>p.ini&&p.fim&&p.fim>=p.ini).map(p=>{const a=cal.idx(p.ini),b=cal.idx(addDia(p.fim));return{ini:a,fim:Math.max(a+0.5,b),obs:p.obs||""};}).sort((x,y)=>x.ini-y.ini);
      if(!per.length){const ini=Math.max(S0,pred?pred.fim+lag:S0);per=[{ini,fim:ini+d,auto:true}];aviso=(aviso?aviso+" ":"")+"Sem períodos cadastrados — usei a duração como estimativa.";}
      else if(pred&&per[0].ini<pred.fim+lag-1e-6)aviso=(aviso?aviso+" ":"")+`Começa em ${fd(cal.data(per[0].ini))}, antes de ${pred.s.nome} terminar (${fd(cal.fim(pred.fim))}).`;
      const i0=Math.min(...per.map(p=>p.ini)),f0=Math.max(...per.map(p=>p.fim));
      for(let i=0;i<N;i++)un.push({ini:i0,fim:f0,eq:0,espera:0});
    }else if(gl){
      const ini=Math.max(S0,pred?pred.fim+lag:S0);
      for(let i=0;i<N;i++)un.push({ini,fim:ini+d,eq:0,espera:0});
      per=[{ini,fim:ini+d}];
    }else{
      const free=Array(k).fill(S0),usada=Array(k).fill(false);
      for(let i=0;i<N;i++){
        let t=0;for(let j=1;j<k;j++)if(free[j]<free[t])t=j;
        const pronto=pred?pred.un[i].fim+lag:S0;
        const ini=Math.max(free[t],pronto);
        const w=usada[t]&&predUn?ini-free[t]:0;
        if(w>1e-6){espera+=w;if(primeiraEspera===null)primeiraEspera=i;}
        un.push({ini,fim:ini+d,eq:t,espera:w});free[t]=ini+d;usada[t]=true;
      }
      if(pred)for(let i=0;i<N;i++)ideal=Math.max(ideal,pred.un[i].fim+lag-Math.floor(i/k)*d);
      if(predUn)folga=Math.min(...un.map((u,i)=>u.ini-(pred.un[i].fim+lag)));
    }
    if(fixo&&predReal&&tp!=="periodos"){
      if(tp==="unit"){const n=un.filter((u,i)=>u.ini<predReal.un[i].fim+lag-1e-6).length;
        if(n)aviso=(aviso?aviso+" ":"")+`Início manual: ${n} ${(o.prefixo||"un").toLowerCase()}(s) começariam antes de ${predReal.s.nome} terminar nelas.`;}
      else if(un[0].ini<predReal.fim+lag-1e-6)aviso=(aviso?aviso+" ":"")+`Início manual antes de ${predReal.s.nome} terminar (${fd(cal.fim(predReal.fim))}).`;}
    const inicio=Math.min(...un.map(u=>u.ini)),fim=Math.max(...un.map(u=>u.fim));
    const diasTrab=tp==="unit"?d*N:per.reduce((a,p)=>a+(p.fim-p.ini),0);
    const r={s,tp,gl,fixo,cor:CORES[si%CORES.length],un,per,inicio,fim,espera,primeiraEspera,ideal,folga,pred:pred||(fixo?predReal:null),predUn:pred&&!pred.gl,aviso,k,d,pes,diasTrab,
      ritmo:k/d*(o.sabado?6:5),custo:tp==="unit"?(+s.custo||0)*N:(+s.custo||0),hh:pes*k*(tp==="unit"?d*N/k:diasTrab)};
    res[s.id]=r;ordem.push(r);
  });
  const fim=ordem.length?Math.max(...ordem.map(r=>r.fim)):0;
  // efetivo diário
  const dias=Math.ceil(fim)+1,efe=new Array(dias).fill(0);
  const add=(a,b,p)=>{for(let x=Math.floor(a+1e-9);x<Math.ceil(b-1e-9)&&x<dias;x++)efe[x]+=p;};
  ordem.forEach(r=>{if(!r.pes)return;if(r.tp==="unit")r.un.forEach(u=>add(u.ini,u.fim,r.pes));else r.per.forEach(p=>add(p.ini,p.fim,r.pes));});
  return{cal,N,ordem,fim,efe,custo:ordem.reduce((a,r)=>a+r.custo,0)};
}

// ---------- Estado ----------
let db=null,obras=[],atual=null,aba="geral",salvarT=null,pend=null,gravando=0,ultimaGrav=0,fila=Promise.resolve();
function obraAtual(){return obras.find(o=>o.id===atual);}
function salvar(o){pend=o;clearTimeout(salvarT);salvarT=setTimeout(()=>{const x=pend;pend=null;if(!x)return;
  const {id,...dados}=JSON.parse(JSON.stringify(x));gravando++;
  fila=fila.then(()=>db.collection("obras").doc(id).set(dados)).catch(()=>toast("Erro ao salvar")).finally(()=>{gravando--;ultimaGrav=Date.now();});},400);}
const ocupado=()=>pend||gravando>0||Date.now()-ultimaGrav<2000;

// ---------- Telas ----------
function render(){
  const a=$("app");a.innerHTML="";
  if(!atual||!obraAtual()){atual=null;return telaObras(a);}
  telaObra(a,obraAtual());
}

function telaObras(a){
  a.append(el("h1",null,"🏗️ Planejamento de Obras"));
  a.append(el("button",{class:"pri",style:"width:100%;margin-bottom:12px",onclick:novaObra},"+ Nova obra"));

      const d=mk(G,"circle",{cx,cy:y+RH/2,r:5,fill:"#dc2626",stroke:"#fff","stroke-width":"1.5"});tip(d,`Alcança ${r.pred.s.nome} no ${P} ${r.primeiraEspera+1}`);}
    if(r.pred&&pos[r.pred.s.id]!=null){const yp=pos[r.pred.s.id]+RH/2,yc=y+RH/2;
      const xp=r.predUn&&r.tp==="unit"?X(r.pred.un[0].fim):X(r.pred.fim),xc=X(r.inicio);
      mk(G,"path",{d:`M${xp} ${yp} L${xp+4} ${yp} L${xp+4} ${yc} L${xc} ${yc}`,fill:"none",stroke:mut,"stroke-width":"1","stroke-opacity":"0.7"});
      mk(G,"path",{d:`M${xc} ${yc} l-5 -3 v6 z`,fill:mut,"fill-opacity":"0.8"});}
  });
  // efetivo
  const mx=Math.max(1,...c.efe),base=Hg+EH+8;
  mk(G,"line",{x1:0,x2:W,y1:Hg,y2:Hg,stroke:bd});mk(G,"line",{x1:0,x2:W,y1:base,y2:base,stroke:bd});
  c.efe.forEach((v,d)=>{if(!v)return;const h=v/mx*(EH-14);const b=mk(G,"rect",{x:X(d),y:base-h,width:Math.max(1,px-0.5),height:h,fill:"var(--ac)","fill-opacity":"0.6"});tip(b,`${fd(cal.data(d))}: ${v} pessoas`);});
  let pi=0;c.efe.forEach((v,i)=>{if(v>c.efe[pi])pi=i;});
  if(c.efe[pi])mk(G,"text",{x:X(pi),y:base-(EH-14)-3,fill:tx,"font-size":"10","font-weight":"700"},"pico "+c.efe[pi]);
  mk(Ls,"text",{x:6,y:base,fill:mut,"font-size":"10"},"máx. "+Math.max(0,...c.efe));
  const wrap=el("div",{class:"chart",style:"display:flex;overflow:hidden"});
  const esq=el("div",{style:"flex:0 0 auto;background:var(--card)"});esq.append(Ls);
  const dir=el("div",{style:"flex:1;overflow-x:auto"});dir.append(G);
  wrap.append(esq,dir);
  if(hi>0&&hi<dias)setTimeout(()=>{dir.scrollLeft=Math.max(0,X(hi)-80);},0);
  return wrap;
}

// ---------- Inicialização ----------
render();
// ===== Versão de demonstração: dados salvos no navegador (localStorage) =====
const LS="obras-demo-v1";
function lerLS(){try{return JSON.parse(localStorage.getItem(LS))||{};}catch(e){return {};}}
function gravarLS(d){try{localStorage.setItem(LS,JSON.stringify(d));}catch(e){toast("Não foi possível salvar neste navegador");}}
const ouvintes=[];
function avisar(){const d=lerLS();const docs=Object.entries(d).map(([id,v])=>({id,data:()=>JSON.parse(JSON.stringify(v))}));ouvintes.forEach(f=>f({docs}));}
db={collection:()=>({
  doc:(id)=>{id=id||("o"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
    return{id,set:async(v)=>{const d=lerLS();d[id]=v;gravarLS(d);setTimeout(avisar,0);},delete:async()=>{const d=lerLS();delete d[id];gravarLS(d);setTimeout(avisar,0);},
      update:async(v)=>{const d=lerLS();d[id]=Object.assign(d[id]||{},v);gravarLS(d);setTimeout(avisar,0);}};},
  onSnapshot:(f)=>{ouvintes.push(f);setTimeout(avisar,0);return()=>{};}})};
function obraExemplo(){
  const m=modeloObra(),o={nome:"Residencial Exemplo (demonstração)",codigo:"DEMO-01",status:"Em andamento",tipoObra:"Residencial multifamiliar",padrao:"Normal",
    cliente:"Cliente Exemplo",rt:"Eng. Responsável",cidade:"Ipatinga/MG",inicio:"2026-01-05",unidades:35,prefixo:"Apto",sabado:false,feriados:[],
    area:"2450",pavimentos:"5",blocos:"1",etapas:m.etapas,servicos:m.servicos,exec:{},projetos:[],criado:Date.now()};
  const pega=n=>o.servicos.find(x=>x.nome===n);
  pega("Mestras").dur=3;pega("Gesso").dur=2;pega("Marcação e elevação").equipes=2;
  // marca como executado o que já deveria estar pronto até alguns dias atrás
  const c=calcular(o),hi=c.cal.idx(hojeISO())-4;
  c.ordem.forEach(r=>{const ex={};
    if(r.tp==="unit")r.un.forEach((u,i)=>{if(u.fim<=hi)ex[i]=c.cal.iso(c.cal.fim(u.fim));});
    else if(r.fim<=hi)ex.g=c.cal.iso(c.cal.fim(r.fim));
    if(Object.keys(ex).length)o.exec[r.s.id]=ex;});
  return o;
}
if(!localStorage.getItem(LS)){const d={};d["exemplo"]=obraExemplo();gravarLS(d);}
document.querySelector(".wrap").insertAdjacentHTML("beforebegin",'<div style="background:#b45309;color:#fff;text-align:center;font-size:.85rem;padding:6px 10px">Versão de demonstração — os dados ficam salvos só neste navegador</div>');
db.collection("obras").onSnapshot(sn=>{
  const novas=sn.docs.map(d=>normalizar(JSON.parse(JSON.stringify({...d.data(),id:d.id}))));
  if(ocupado()){const loc=obraAtual();obras=novas.map(x=>loc&&x.id===loc.id?loc:x);if(loc&&!obras.includes(loc))obras.push(loc);}else obras=novas;
  $("st").textContent="✓ Salvo neste navegador";
  const foco=document.activeElement&&["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName);
  if(!foco)render();
});
